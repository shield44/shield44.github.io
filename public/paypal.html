<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/favicon.png">
  <title>PayPal Donation</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #00457C;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    h2 {
      color: #0070BA;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.1rem;
      margin: 0.5rem 0;
      color: #ccc;
    }

    .redirect-message {
      color: #0070BA;
      font-style: italic;
      margin: 2rem 0;
    }

    .paypal-link {
      display: inline-block;
      background-color: #0070BA;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin: 1rem 0;
      transition: background-color 0.3s ease;
    }

    .paypal-link:hover {
      background-color: #00457C;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
  <script>
    // Redirect to PayPal payment URL after a short delay
    setTimeout(function() {
      window.location.href = "https://www.paypal.com/ncp/payment/U6R3LJEMJ8XC2";
    }, 2000);
  </script>
</head>
<body>

  <h1>PayPal</h1>
  <h2>Support My Work</h2>
  <p>Your support helps me continue developing open-source projects!</p>

  <p class="redirect-message">Redirecting you to PayPal in 2 seconds...</p>
  
  <a href="https://www.paypal.com/ncp/payment/U6R3LJEMJ8XC2" class="paypal-link" target="_blank" rel="noopener noreferrer">
    Click here if you're not redirected automatically
  </a>

  <p>K S THEJAS</p>

  <footer>
    © 2025 PayPal Inc. All rights reserved.
  </footer>

</body>
</html>
